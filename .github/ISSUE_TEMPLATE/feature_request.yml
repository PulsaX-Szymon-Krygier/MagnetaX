name: Feature request
description: Suggest a new feature or an improvement
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or improve?
      description: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: Explain what problem this solves or why it would be useful.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: If you already have an idea for how this could work, describe it here.